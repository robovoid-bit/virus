<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom JS Multi-Threaded CPU Benchmark</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { margin-bottom: 5px; color: #4f46e5; }
        .status { color: #a1a1aa; margin-bottom: 20px; font-size: 0.95rem; }
        #canvas-preview {
            border: 2px solid #4f46e5;
            background: #111;
            border-radius: 8px;
            margin-bottom: 20px;
            max-width: 100%;
        }
        .results-box {
            background: #111116;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-top: 15px;
            border-left: 4px solid #10b981;
            display: none;
        }
        .score-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #10b981;
            margin-top: 5px;
        }
        .loader {
            border: 4px solid #3f3f46;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>CoreBench v1.0</h1>
    <div id="cpu-info" class="status">Detecting CPU cores...</div>
    
    <div id="loading-engine">
        <div class="loader"></div>
        <p id="progress-text">Initializing multithreaded rendering engine...</p>
    </div>

    <canvas id="canvas-preview" width="300" height="300"></canvas>

    <div id="results" class="results-box">
        <div>Benchmark Complete!</div>
        <div id="score" class="score-value">-- Keys/sec</div>
        <div id="time-taken" style="color: #a1a1aa; font-size: 0.85rem; margin-top: 5px;"></div>
    </div>
</div>

<script>
// 1. CREATE INLINE WEB WORKER SCRIPT AS A BLOB
// This allows everything to live inside one single HTML file instead of separate files.
const workerCode = `
    self.onmessage = function(e) {
        const { startY, endY, width, height, iterations } = e.data;
        const totalPixels = width * (endY - startY);
        const buffer = new Uint8ClampedArray(totalPixels * 4);
        
        let index = 0;
        let opsPerformed = 0;

        // Mathematical Mandelbrot fractal rendering loop to stress-test raw math CPU throughput
        for (let y = startY; y < endY; y++) {
            for (let x = 0; x < width; x++) {
                let c_re = (x - width / 2.0) * 4.0 / width;
                let c_im = (y - height / 2.0) * 4.0 / height;
                let x_val = 0, y_val = 0;
                let iter = 0;
                
                while (x_val*x_val + y_val*y_val <= 4 && iter < iterations) {
                    let x_new = x_val*x_val - y_val*y_val + c_re;
                    y_val = 2*x_val*y_val + c_im;
                    x_val = x_new;
                    iter++;
                    opsPerformed += 5; // Track algorithmic weight
                }

                // Map results to visual pixels on the canvas
                let r = (iter % 8) * 32;
                let g = (iter % 16) * 16;
                let b = (iter % 32) * 8;

                buffer[index++] = r;   // R
                buffer[index++] = g;   // G
                buffer[index++] = b;   // B
                buffer[index++] = 255; // Alpha
            }
        }

        // Return processed chunk back to the master window thread
        self.postMessage({ buffer, startY, endY, opsPerformed }, [buffer.buffer]);
    };
`;

const blob = new Blob([workerCode], { type: 'application/javascript' });
const workerUrl = URL.createObjectURL(blob);

// 2. MAIN APPLICATION CORE
window.addEventListener('DOMContentLoaded', () => {
    // Check local processing units available
    const threads = navigator.hardwareConcurrency || 4;
    document.getElementById('cpu-info').innerText = `Detected ${threads} Logical CPU Threads. Stress testing all cores...`;

    const canvas = document.getElementById('canvas-preview');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    
    // Test parameters
    const iterations = 5000; // Workload density per pixel
    const chunkSize = Math.floor(height / threads);
    let completedWorkers = 0;
    let totalOps = 0;
    
    const startTime = performance.now();
    
    // Spawn threads automatically matching CPU boundaries
    for (let i = 0; i < threads; i++) {
        const worker = new Worker(workerUrl);
        
        const startY = i * chunkSize;
        // Ensure the last worker cleans up any remainder rows from uneven division
        const endY = (i === threads - 1) ? height : (i + 1) * chunkSize;

        worker.postMessage({ startY, endY, width, height, iterations });

        // Handle calculated outputs sent from processing nodes
        worker.onmessage = function(e) {
            const { buffer, startY, endY, opsPerformed } = e.data;
            totalOps += opsPerformed;

            // Draw computed chunk onto main user interface 
            const imgData = ctx.createImageData(width, endY - startY);
            imgData.data.set(buffer);
            ctx.putImageData(imgData, 0, startY);

            completedWorkers++;
            worker.terminate(); // Clean up thread tracking variables dynamically

            // Finalise metric scoring arrays once complete
            if (completedWorkers === threads) {
                const endTime = performance.now();
                const timeTakenSec = (endTime - startTime) / 1000;
                
                // Calculate an architectural absolute processing raw throughput score
                const finalScore = Math.round(totalOps / timeTakenSec);

                // Update UI layout components
                document.getElementById('loading-engine').style.display = 'none';
                const resBox = document.getElementById('results');
                resBox.style.display = 'block';
                document.getElementById('score').innerText = `${finalScore.toLocaleString()} Ops/Sec`;
                document.getElementById('time-taken').innerText = `Completed in ${timeTakenSec.toFixed(3)} seconds`;
                
                // Revoke object allocation references
                URL.revokeObjectURL(workerUrl);
            }
        };
    }
});
</script>

</body>
</html>
