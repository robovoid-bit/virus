<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Portfolio Vault</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .hidden { display: none !important; }
        
        /* Gatekeeper Card */
        .gatekeeper { background: var(--card); padding: 40px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.6rem; margin-bottom: 8px; }
        p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-bottom: 12px; outline: none; text-align: center; font-size: 1.1rem; }
        button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .error { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 18px; }

        /* Showcase Layout */
        .portfolio-wrap { width: 100%; max-width: 1100px; align-self: flex-start; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .canvas-holder { width: 100%; height: 240px; background: #000; }
        .canvas-holder iframe { width: 100%; height: 100%; border: none; }
        .meta { padding: 16px; }
        .title { font-weight: bold; font-size: 1.1rem; margin-bottom: 6px; }
        .desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- GATEKEEPER AREA -->
    <div id="authGate" class="gatekeeper">
        <h1>Private 3D Showcase</h1>
        <p>Enter an authorized code to view models.</p>
        <input type="password" id="passCode" placeholder="••••••••" autocomplete="off">
        <button onclick="checkAccess()">Unlock System</button>
        <div id="err" class="error"></div>
    </div>

    <!-- GALLERY AREA -->
    <div id="galleryView" class="portfolio-wrap hidden">
        <header>
            <h2>My 3D Models</h2>
            <button onclick="window.location.reload()" style="width:auto; padding: 6px 12px; background:transparent; border:1px solid var(--border);">Lock</button>
        </header>
        <div id="modelGrid" class="grid"></div>
    </div>

    <!-- INJECT CONFIGURATION FROM CLOUD FILE -->
    <script src="config.js"></script>
    <script>
        function checkAccess() {
            const val = document.getElementById('passCode').value.trim();
            const err = document.getElementById('err');
            
            // Fast prefix check
            const hasValidPrefix = val.startsWith("553467");
            // Custom list fallback check
            const inCustomList = PORTFOLIO_CONFIG.allowedCustomCodes.includes(val);

            if (hasValidPrefix || inCustomList) {
                document.getElementById('authGate').classList.add('hidden');
                document.getElementById('galleryView').classList.remove('hidden');
                buildShowcase();
            } else {
                err.innerText = "Invalid access code allocation.";
            }
        }

        function buildShowcase() {
            const grid = document.getElementById('modelGrid');
            grid.innerHTML = '';
            
            PORTFOLIO_CONFIG.my3DModels.forEach(model => {
                const item = document.createElement('div');
                item.className = 'card';
                item.innerHTML = `
                    <div class="canvas-holder">
                        <iframe src="${model.embedUrl}" allowfullscreen allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
                    </div>
                    <div class="meta">
                        <div class="title">${model.title}</div>
                        <div class="desc">${model.desc}</div>
                    </div>
                `;
                grid.appendChild(item);
            });
        }
    </script>
</body>
</html>
