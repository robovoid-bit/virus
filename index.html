<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Multi-Image Cloner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Base template container hidden from view */
        .templates {
            display: none;
        }

        /* Universal style for clones */
        .clone {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Keeps the page responsive */
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 35 Different Base Image Clones -->
    <!-- Using Picsum Photos with unique IDs and standard parameters to simulate network requests -->
    <div class="templates">
        <img class="shape-0" src="https://picsum.photos" style="width: 40px; height: 40px;">
        <img class="shape-1" src="https://picsum.photos" style="width: 50px; height: 50px;">
        <img class="shape-2" src="https://picsum.photos" style="width: 60px; height: 60px;">
        <img class="shape-3" src="https://picsum.photos" style="width: 70px; height: 70px;">
        <img class="shape-4" src="https://picsum.photos" style="width: 80px; height: 80px;">
        <img class="shape-5" src="https://picsum.photos" style="width: 45px; height: 45px;">
        <img class="shape-6" src="https://picsum.photos" style="width: 55px; height: 55px;">
        <img class="shape-7" src="https://picsum.photos" style="width: 65px; height: 65px;">
        <img class="shape-8" src="https://picsum.photos" style="width: 75px; height: 75px;">
        <img class="shape-9" src="https://picsum.photos" style="width: 85px; height: 85px;">
        <img class="shape-10" src="https://picsum.photos" style="width: 40px; height: 60px;">
        <img class="shape-11" src="https://picsum.photos" style="width: 50px; height: 70px;">
        <img class="shape-12" src="https://picsum.photos" style="width: 60px; height: 80px;">
        <img class="shape-13" src="https://picsum.photos" style="width: 70px; height: 90px;">
        <img class="shape-14" src="https://picsum.photos" style="width: 80px; height: 100px;">
        <img class="shape-15" src="https://picsum.photos" style="width: 60px; height: 40px;">
        <img class="shape-16" src="https://picsum.photos" style="width: 70px; height: 50px;">
        <img class="shape-17" src="https://picsum.photos" style="width: 80px; height: 60px;">
        <img class="shape-18" src="https://picsum.photos" style="width: 90px; height: 70px;">
        <img class="shape-19" src="https://picsum.photos" style="width: 100px; height: 80px;">
        <img class="shape-20" src="https://picsum.photos" style="width: 40px; height: 40px; border-radius: 50%;">
        <img class="shape-21" src="https://picsum.photos" style="width: 50px; height: 50px; border-radius: 50%;">
        <img class="shape-22" src="https://picsum.photos" style="width: 60px; height: 60px; border-radius: 50%;">
        <img class="shape-23" src="https://picsum.photos" style="width: 70px; height: 70px; border-radius: 50%;">
        <img class="shape-24" src="https://picsum.photos" style="width: 80px; height: 80px; border-radius: 50%;">
        <img class="shape-25" src="https://picsum.photos" style="width: 45px; height: 45px; transform: rotate(15deg);">
        <img class="shape-26" src="https://picsum.photos" style="width: 55px; height: 55px; transform: rotate(30deg);">
        <img class="shape-27" src="https://picsum.photos" style="width: 65px; height: 65px; transform: rotate(45deg);">
        <img class="shape-28" src="https://picsum.photos" style="width: 75px; height: 75px; transform: rotate(60deg);">
        <img class="shape-29" src="https://picsum.photos" style="width: 85px; height: 85px; transform: rotate(75deg);">
        <img class="shape-30" src="https://picsum.photos" style="width: 50px; height: 50px; opacity: 0.8;">
        <img class="shape-31" src="https://picsum.photos" style="width: 60px; height: 60px; opacity: 0.8;">
        <img class="shape-32" src="https://picsum.photos" style="width: 70px; height: 70px; opacity: 0.8;">
        <img class="shape-33" src="https://picsum.photos" style="width: 80px; height: 80px; opacity: 0.8;">
        <img class="shape-34" src="https://picsum.photos" style="width: 90px; height: 90px; opacity: 0.8;">
    </div>

    <script>
        // Store base template elements and their clean URLs
        const templates = [];
        for (let i = 0; i < 35; i++) {
            templates.push(document.querySelector(`.shape-${i}`));
        }

        // Generate a random HEX color to tint the image background/border
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Clone mechanism with forced loading delay via unique query parameters
        function spawnClone() {
            const randomTemplate = templates[Math.floor(Math.random() * 35)];
            const clone = randomTemplate.cloneNode(true);
            
            // Generate random screen positions
            const posX = Math.random() * window.innerWidth;
            const posY = Math.random() * window.innerHeight;
            const color = getRandomColor();

            // Set layout styling
            clone.classList.add('clone');
            clone.style.left = `${posX}px`;
            clone.style.top = `${posY}px`;
            
            // Random tinted background color while the image asset loads
            clone.style.backgroundColor = color;

            // FORCE LOADING DELAY: 
            // Adding a completely unique timestamp parameter tells the browser 
            // to bypass cache and fetch it freshly every single time over the internet.
            const baseSrc = randomTemplate.getAttribute('src');
            clone.src = `${baseSrc}?cachebust=${Date.now()}-${Math.random()}`;

            // Instantly append clone onto the page layout
            document.body.appendChild(clone);
        }

        // High frequency execution loop (batch processing for ~0.001s feel)
        function instantLoop() {
            // Adjust the loop count here if you want to spawn even more items per frame
            for (let i = 0; i < 16; i++) {
                spawnClone();
            }
            requestAnimationFrame(instantLoop);
        }

        // Fire loop immediately
        instantLoop();
    </script>
</body>
</html>
